<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#06376f">
<title>競艇レースシミュレーター</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef4f8;color:#182433;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
header{background:#06376f;color:#fff;padding:14px 12px;position:sticky;top:0;z-index:10}h1{margin:0;font-size:19px}header p{margin:3px 0 0;font-size:11px}
main{max-width:850px;margin:auto;padding:10px 9px 100px}.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px #0002}h2{font-size:16px;color:#06376f;margin:0 0 10px}
.race{display:grid;grid-template-columns:1fr 1fr;gap:8px}input,select{width:100%;height:44px;border:1px solid #c6d5e3;border-radius:8px;padding:0 9px;font-size:16px;background:#fff}
.boat{border:1px solid #ccd9e5;border-radius:12px;overflow:hidden;margin:9px 0}.boat-title{padding:9px;font-weight:900}.n1{background:#fff}.n2{background:#222;color:#fff}.n3{background:#d62e35;color:#fff}.n4{background:#176bbb;color:#fff}.n5{background:#efd000}.n6{background:#42914b;color:#fff}
.fields{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.field label{display:block;font-size:10px;font-weight:800;color:#53677b;margin-bottom:3px}
.run{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:7px}.run button,.reset{height:50px;border:0;border-radius:10px;background:#06376f;color:#fff;font-weight:900;font-size:14px}.reset{width:100%;margin-top:8px;background:#fff;color:#06376f;border:1px solid #9bb0c5;height:42px}
table{width:100%;border-collapse:collapse;font-size:11px}th,td{padding:7px 3px;border-bottom:1px solid #e1e8ef;text-align:center}th{background:#f1f6fa;color:#06376f}.combo{display:flex;justify-content:space-between;padding:9px;border:1px solid #d7e2ec;border-radius:9px;margin:5px 0;font-weight:800}.note{font-size:10px;color:#687a8d;line-height:1.55}.best{font-size:21px;font-weight:900;color:#06376f}
</style>
</head>
<body>
<header><h1>🚤 競艇レースシミュレーター</h1><p>6艇のデータを入力して、1000回シミュレーション</p></header>
<main>
<div class="card"><h2>レース情報</h2><div class="race"><input id="venue" placeholder="競艇場"><input id="race" placeholder="例：12R"></div></div>

<div class="card"><h2>📝 6艇の情報入力</h2><div style="background:#fff3cd;border:1px solid #e6c85c;border-radius:8px;padding:8px;margin-bottom:8px;font-weight:800;color:#765b00">👇 各艇の入力欄はこの下に表示されます</div><div id="boats"></div>
<div class="note">入力欄は6艇すべてに用意されています。タイムは小さいほど有利。枠番勝率は％で入力してください。</div></div>

<div class="card"><h2>🎲 シミュレーション回数</h2><div class="run">
<button onclick="simulate(100)">100回</button><button onclick="simulate(1000)">1000回</button><button onclick="simulate(10000)">10000回</button>
</div><button class="reset" onclick="resetAll()">入力・結果をリセット</button></div>

<div class="card" id="result" style="display:none"><h2>📊 着順確率</h2><div id="table"></div></div>
<div class="card" id="tri" style="display:none"><h2>🎯 三連単ランキング</h2><div id="combos"></div></div>
<div class="card" id="summary" style="display:none"><h2>🏆 総合結果</h2><div id="summaryText"></div></div>
<div class="card"><h2>⚙️ シミュレーションについて</h2><div class="note">平均ST、展示タイム、周り足タイム、直線タイム、過去10走枠番勝率、選手クラスを重み付けし、1号艇のイン優位とランダムな展開を加味します。実際のレース結果を保証するものではありません。</div></div>
</main>
<script>
const cls={A1:1,A2:.72,B1:.48,B2:.25};
const colors=['n1','n2','n3','n4','n5','n6'];
let boats='';
for(let i=0;i<6;i++){
boats+=`<div class="boat"><div class="boat-title ${colors[i]}">${i+1}号艇</div><div class="fields">
<div class="field"><label>平均ST</label><input id="st${i}" type="number" step=".01" inputmode="decimal" placeholder=".15"></div>
<div class="field"><label>展示タイム</label><input id="ex${i}" type="number" step=".01" inputmode="decimal" placeholder="6.80"></div>
<div class="field"><label>周り足タイム</label><input id="turn${i}" type="number" step=".01" inputmode="decimal" placeholder="6.90"></div>
<div class="field"><label>直線タイム</label><input id="str${i}" type="number" step=".01" inputmode="decimal" placeholder="6.85"></div>
<div class="field"><label>過去10走 枠番勝率（%）</label><input id="lane${i}" type="number" step=".1" inputmode="decimal" placeholder="40"></div>
<div class="field"><label>選手クラス</label><select id="cl${i}"><option>A1</option><option>A2</option><option>B1</option><option>B2</option></select></div>
</div></div>`;
}
document.getElementById('boats').innerHTML=boats;
function get(id){const x=parseFloat(document.getElementById(id).value);return Number.isFinite(x)?x:null}
function inv(a,x){const v=a.filter(x=>x!==null);if(x===null||v.length<2)return .5;const mn=Math.min(...v),mx=Math.max(...v);return mn===mx ? .5 : 1-(x-mn)/(mx-mn)}
function makeAbility(){
 let d=[];for(let i=0;i<6;i++)d.push({st:get('st'+i),ex:get('ex'+i),turn:get('turn'+i),str:get('str'+i),lane:get('lane'+i),cl:document.getElementById('cl'+i).value});
 const ex=d.map(x=>x.ex),tu=d.map(x=>x.turn),sr=d.map(x=>x.str);
 return d.map((x,i)=>{
  const st=x.st===null ? .5 : Math.max(0,Math.min(1,(.25-x.st)/.15));
  const lane=x.lane===null ? .5 : Math.max(0,Math.min(1,x.lane/100));
  let a=.27*st+.22*inv(ex,x.ex)+.18*inv(tu,x.turn)+.15*inv(sr,x.str)+.10*lane+.08*cls[x.cl];
  return Math.max(.03,a*[1,.84,.77,.70,.64,.59][i]);
 });
}
function choose(w){let s=w.reduce((a,b)=>a+b,0),r=Math.random()*s;for(let i=0;i<w.length;i++){r-=w[i];if(r<=0)return i}return w.length-1}
function race(a){
 let first=choose(a.map((x,i)=>x*Math.exp((Math.random()-.5)*1.8)*(i===0?1.45:1)));
 let rem=[0,1,2,3,4,5].filter(i=>i!==first);
 let second=rem[choose(rem.map(i=>a[i]*(i<3?1.08:1)))];
 rem=rem.filter(i=>i!==second);
 let third=rem[choose(rem.map(i=>a[i]))];
 return [first,second,third];
}
function simulate(n){
 const a=makeAbility(),pos=Array.from({length:6},()=>[0,0,0]),tri={};
 for(let k=0;k<n;k++){const r=race(a);r.forEach((x,p)=>pos[x][p]++);const key=r.map(x=>x+1).join('-');tri[key]=(tri[key]||0)+1}
 const order=[0,1,2,3,4,5].sort((a,b)=>pos[b][0]-pos[a][0]);
 const pct=(x)=>((x/n)*100).toFixed(1);
 document.getElementById('result').style.display='block';
 document.getElementById('table').innerHTML='<table><tr><th>順位</th><th>艇</th><th>1着率</th><th>2着率</th><th>3着率</th><th>3連率</th></tr>'+order.map((i,k)=>{let t=pos[i][0]+pos[i][1]+pos[i][2];return `<tr><td>${k+1}</td><td><b>${i+1}号艇</b></td><td>${pct(pos[i][0])}%</td><td>${pct(pos[i][1])}%</td><td>${pct(pos[i][2])}%</td><td><b>${pct(t)}%</b></td></tr>`}).join('')+'</table>';
 const top=Object.entries(tri).sort((a,b)=>b[1]-a[1]).slice(0,15);
 document.getElementById('tri').style.display='block';
 document.getElementById('combos').innerHTML=top.map((x,k)=>`<div class="combo"><span>${k+1}位　${x[0]}</span><span>${x[1]}回 (${pct(x[1])}%)</span></div>`).join('');
 const w=order[0];
 document.getElementById('summary').style.display='block';
 document.getElementById('summaryText').innerHTML=`<div class="best">${w+1}号艇</div><p>1着率 <b>${pct(pos[w][0])}%</b> / 3連率 <b>${pct(pos[w].reduce((a,b)=>a+b,0))}%</b></p>`;
}
function resetAll(){document.querySelectorAll('input').forEach(x=>x.value='');document.querySelectorAll('select').forEach(x=>x.selectedIndex=0);['result','tri','summary'].forEach(id=>document.getElementById(id).style.display='none')}
</script>
</body></html>
